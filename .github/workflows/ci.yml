name: CI

# The project's own test suite and registry validity. Zero model calls, zero
# secrets needed -- this must stay runnable on every PR from a fork.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # dev alone is not enough: test_slack.py and test_github.py import
        # httpx at module level (it ships with both the slack and github
        # extras), so collecting the full suite needs it present even though
        # no test here ever makes a real network call. compile's anthropic
        # SDK is not needed -- nothing imports it eagerly; AnthropicClient
        # only imports it inside __init__, and every test either uses
        # StubClient or monkeypatches AnthropicClient outright.
        run: pip install -e ".[dev,slack,github]"

      - name: Test
        run: pytest -q --cov=policyforge --cov-report=term-missing

      - name: Validate the registry
        run: policyctl validate
