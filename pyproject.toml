[project]
name = "policy-forge"
version = "0.1.0"
description = "Compiles unstructured org signals (announcements, postmortems, maintenance notices) into executable policy artifacts, then enforces them deterministically across repos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "croniter>=2.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
compile = ["anthropic>=0.40", "python-dotenv>=1.0"]
slack = ["httpx>=0.27", "python-dotenv>=1.0"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
github = ["httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
policyctl = "policyforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
